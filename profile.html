<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Profile - Guitarent</title>
  <link rel="stylesheet" href="./css/profile.css">
</head>

<body>

  <header>
    <nav class="navbar">
      <a href="Website.html" class="logo">
        <p class="guitarent">Guitarent</p>
      </a>
      <ul class="nav-links">
        <li><a href="Website.html">Home / Store</a></li>
        <li><a href="profile.html" class="active">My Account</a></li>
      </ul>
      <button id="logout-btn" class="btn-logout">Sign Out</button>
    </nav>
  </header>

  <main class="profile-main">
    <div class="profile-container">
      
      <!-- User Summary / Avatar Card -->
      <div class="profile-card user-info-card">
        <div class="avatar-circle" id="avatar-initials">G</div>
        <h2 id="display-name">Guitarist</h2>
        <p id="display-email">user@guitarent.com</p>
        <span class="member-badge">VIP Guitarist Member</span>
      </div>

      <!-- Account Edit Form -->
      <div class="profile-card edit-card">
        <h3>Edit Personal Information</h3>
        <form id="profile-form">
          <div class="input-box">
            <label for="profile-fullname">Full Name</label>
            <input type="text" id="profile-fullname" placeholder="Enter full name" required maxlength="40">
          </div>

          <div class="input-box">
            <label for="profile-email">Email Address</label>
            <input type="email" id="profile-email" placeholder="Enter email address" required maxlength="50">
          </div>

          <div class="input-box">
            <label for="profile-phone">Phone Number</label>
            <input type="tel" id="profile-phone" placeholder="Enter phone number" maxlength="15">
          </div>

          <div class="input-box">
            <label for="profile-address">Shipping Address</label>
            <input type="text" id="profile-address" placeholder="Enter shipping address" maxlength="100">
          </div>

          <button type="submit" id="button">Save Profile</button>
        </form>
      </div>

      <!-- Recent Orders Section -->
      <div class="profile-card orders-card">
        <h3>Recent Orders</h3>
        <div id="orders-list">
          <p class="no-orders">No recent guitar rentals or purchases yet.</p>
        </div>
      </div>

    </div>
  </main>

  <script src="./js/profile.js"></script>
</body>

</html>
