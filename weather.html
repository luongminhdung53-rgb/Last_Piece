<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Check - Guitarent</title>
  <link rel="stylesheet" href="./css/weather.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <header>
    <nav class="navbar" id="top_header">
      <a href="Website.html" class="logo">
        <p class="guitarent">Guitarent weather</p>
      </a>
      <ul class="nav-links">
        <li><a href="Website.html#Gibson" class="active">Gibson</a></li>
        <li><a href="Website.html#Fender" class="active">Fender</a></li>
        <li><a href="Website.html#Epiphone" class="active">Epiphone</a></li>
        <li><a href="Website.html#Kramer" class="active">Kramer</a></li>
        <li><a href="Website.html#PRS" class="active">PRS Guitars</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn"> Cart (<span id="cart-count">0</span>)</a>
        <div id="nav-auth-container">
          <a href="Sign_in.html" id="button">Sign In</a>
        </div>
      </div>
    </nav>
  </header>
  <main class="weather-section">
    <div class="weather-card">
      <h1>Outdoor Weather</h1>
      <p>What's the weather in your city?</p>

      <form id="weather-form">
        <div class="input-group">
          <label for="location-input">City Name</label>
          <input type="text" id="location-input" placeholder="e.g. Hanoi, Tokyo, London" required maxlength="40">
        </div>

        <button type="submit" class="btn btn-primary">Search Weather</button>
        <button type="button" id="device-location-btn" class="btn btn-secondary">
          <i class="fa-solid fa-location-crosshairs"></i> Use My Location
        </button>
      </form>

      <div id="weather-result" class="weather-result hidden">
        <h2 id="city-name"></h2>
        <div id="temperature" class="temp-display"></div>
        <p id="weather-desc" class="weather-desc"></p>
      </div>
    </div>
  </main>

  <script type="module" src="./js/weather.js"></script>
</body>

</html>
