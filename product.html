<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitarent - Product Details</title>
  <link rel="stylesheet" href="./css/product.css">
</head>

<body>
  <header>
    <nav class="navbar" id="top_header">
      <a href="index.html" class="logo">
        <p class="guitarent">Guitarent</p>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Gibson</a></li>
        <li><a href="index.html#Fender">Fender</a></li>
        <li><a href="index.html#Epiphone">Epiphone</a></li>
        <li><a href="index.html#Kramer">Kramer</a></li>
        <li><a href="index.html#PRS">PRS Guitars</a></li>
      </ul>
      <div class="nav-actions">
        <a href="cart.html" class="cart-btn">Cart (<span id="cart-count">0</span>)</a>
        <div id="nav-auth-container">
          <a href="Sign_in.html" id="button">Sign In</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="product-container">
    <a href="index.html" class="back-link">← Back to Catalog</a>

    <div id="product-loading" class="specs-box product-loading">
      <h3>Loading guitar details...</h3>
    </div>

    <div id="product-detail-view" class="product-wrapper is-hidden">
      <div class="product-image-box">
        <img id="product-img" src="" alt="Guitar Image" class="product-detail-img">
      </div>

      <div class="product-info-col">
        <span id="product-brand" class="brand-badge">Brand</span>
        <h1 id="product-name" class="product-title">Guitar Name</h1>
        <p id="product-price" class="price-tag">$0</p>

        <div class="specs-box product-desc-box">
          <h3 class="specs-heading">Description & Specs</h3>
          <p id="product-desc" class="specs-text">Loading description...</p>
        </div>

        <div class="product-actions-row">
          <div class="quantity-selector">
            <button type="button" id="qty-minus">-</button>
            <input type="number" id="qty-input" value="1" min="1" readonly>
            <button type="button" id="qty-plus">+</button>
          </div>

          <button type="button" id="add-to-cart-btn" class="add-to-cart-btn">
            Add to Cart
          </button>
        </div>

        <p id="cart-feedback" class="cart-feedback"></p>
      </div>
    </div>
  </main>

  <script type="module" src="./js/product.js"></script>
</body>

</html>
