<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Guitarent</title>

    <link rel="stylesheet" href="./css/authen.css">
</head>

<body class="signup-body">

    <section class="signup-section">
        <div class="signup-container">
            <h1>Create Account</h1>
            <p>Join today and get started</p>

            <form id="signup-form">
                <div class="input-box">
                    <label>Full Name</label>

                    <input type="text" id="signup-fullname" placeholder="Enter your full name" required maxlength="40">
                </div>

                <div class="input-box">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="Enter your email" required maxlength="50">
                </div>

                <div class="input-box">
                    <label>Password</label>

                    <input type="password" id="signup-password" placeholder="Enter your password" required minlength="8"
                        maxlength="20">
                </div>

                <div class="input-box">
                    <label>Confirm Password</label>

                    <input type="password" id="signup-confirm" placeholder="Confirm your password" required
                        minlength="8" maxlength="20">
                </div>

                <div class="terms">
                    <input type="checkbox" required>
                    <span>I agree to the Terms & Conditions</span>
                </div>
                <button type="submit" id="button">Sign Up</button>

                <p class="login-link">Already have an account? <a href="Sign_in.html">Log In</a></p>
            </form>
        </div>
    </section>

    <script src="./js/authen.js"></script>
</body>

</html>
